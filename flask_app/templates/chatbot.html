<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CropGuard Assistant - Chat with Raju 🌱</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-glow: rgba(0, 184, 148, 0.45);
            --secondary-glow: rgba(9, 132, 227, 0.45);
            --neon-green: #00b894;
            --neon-blue: #0984e3;
            --emerald-dark: #081c15;
            --emerald-deep: #1b4332;
            --glass-bg: rgba(27, 67, 50, 0.25);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-light: #f5f7fa;
            --text-muted: #a3b899;
            --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--emerald-dark);
            background-image: 
                radial-gradient(at 10% 20%, rgba(8, 28, 21, 1) 0px, transparent 50%),
                radial-gradient(at 90% 10%, rgba(27, 67, 50, 0.3) 0px, transparent 50%),
                radial-gradient(at 50% 80%, rgba(45, 106, 79, 0.25) 0px, transparent 50%);
            color: var(--text-light);
            font-family: 'Outfit', sans-serif;
            line-height: 1.6;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Nav Glassmorphism Bar */
        nav {
            background: rgba(8, 28, 21, 0.7);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
            flex-shrink: 0;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 0;
        }

        .logo {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.65rem;
            font-weight: 800;
            background: linear-gradient(135deg, #52b788, var(--neon-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: var(--transition);
        }

        .logo i {
            font-size: 1.9rem;
            color: var(--neon-green);
            -webkit-text-fill-color: initial;
            filter: drop-shadow(0 0 8px var(--primary-glow));
        }

        .nav-links {
            display: flex;
            list-style: none;
            align-items: center;
            gap: 2rem;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 1.05rem;
            transition: var(--transition);
            position: relative;
            padding: 0.5rem 0;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--text-light);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--neon-green), var(--neon-blue));
            transition: var(--transition);
            box-shadow: 0 0 8px var(--primary-glow);
        }

        .nav-links a:hover::after, .nav-links a.active::after {
            width: 100%;
        }

        .menu-toggle {
            display: none;
            cursor: pointer;
            font-size: 1.5rem;
            color: var(--text-light);
        }

        /* Main Chat Window Area */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            padding: 1.5rem 0;
            overflow: hidden;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }

        .chat-box {
            flex: 1;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            margin-bottom: 5.5rem;
            position: relative;
        }

        .chat-header {
            padding: 1.25rem 2rem;
            background: rgba(8, 28, 21, 0.5);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .chat-header .status-indicator {
            width: 10px;
            height: 10px;
            background-color: var(--neon-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--neon-green);
            animation: pulse 2s infinite;
        }

        .chat-header h2 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-light);
        }

        .chat-header span {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .chat-messages {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            position: relative;
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(0, 184, 148, 0.4);
            border-radius: 4px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .welcome-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            max-width: 450px;
            width: 100%;
            padding: 2rem;
            z-index: 10;
            transition: var(--transition);
        }

        .welcome-overlay i {
            font-size: 4rem;
            color: var(--neon-green);
            margin-bottom: 1.5rem;
            filter: drop-shadow(0 0 10px var(--primary-glow));
        }

        .welcome-overlay h3 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--text-light);
            margin-bottom: 0.75rem;
        }

        .welcome-overlay p {
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 300;
            line-height: 1.6;
        }

        /* Message Bubbles */
        .message {
            display: flex;
            flex-direction: column;
            max-width: 75%;
            animation: messageFade 0.4s cubic-bezier(0.165, 0.84, 0.44, 1) both;
        }

        .message.user {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message.bot {
            align-self: flex-start;
            align-items: flex-start;
        }

        .message-text {
            padding: 1rem 1.35rem;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.5;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            font-weight: 400;
        }

        .user .message-text {
            background: linear-gradient(135deg, var(--neon-green), #40916c);
            color: white;
            border-bottom-right-radius: 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .bot .message-text {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-light);
            border-bottom-left-radius: 0;
            border: 1px solid var(--glass-border);
        }

        /* Bot replies styling with raw Markdown rendering */
        .bot .message-text strong {
            color: #52b788;
            font-weight: 600;
        }

        .bot .message-text p {
            margin-bottom: 0.5rem;
        }

        .bot .message-text ul, .bot .message-text ol {
            margin-left: 1.25rem;
            margin-bottom: 0.5rem;
        }

        .bot .message-text li {
            margin-bottom: 0.25rem;
        }

        /* Example Prompts Panel */
        .example-prompts {
            position: absolute;
            bottom: 60px;
            left: 0;
            width: 100%;
            padding: 0 1.5rem;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.75rem;
            z-index: 5;
        }

        .example-prompts button {
            background: rgba(8, 28, 21, 0.6);
            backdrop-filter: blur(5px);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            border-radius: 20px;
            padding: 0.6rem 1.15rem;
            font-size: 0.85rem;
            font-family: 'Outfit', sans-serif;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .example-prompts button:hover {
            border-color: var(--neon-green);
            color: var(--text-light);
            background: var(--glass-bg);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 184, 148, 0.25);
        }

        /* Chat Input field */
        .chat-input-bar {
            position: absolute;
            bottom: 10px;
            left: 0;
            width: 100%;
            padding: 0 1.5rem;
            display: flex;
            gap: 0.75rem;
            align-items: center;
            z-index: 5;
        }

        .chat-input-bar input {
            flex: 1;
            background: rgba(8, 28, 21, 0.65);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 0.95rem 1.5rem;
            color: white;
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            outline: none;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        .chat-input-bar input:focus {
            border-color: rgba(0, 184, 148, 0.5);
            background: rgba(8, 28, 21, 0.8);
            box-shadow: 0 0 15px rgba(0, 184, 148, 0.15);
        }

        .chat-input-bar button {
            background: linear-gradient(135deg, var(--neon-green), #40916c);
            border: none;
            color: white;
            border-radius: 14px;
            padding: 0.95rem 1.75rem;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 15px rgba(0, 184, 148, 0.3);
        }

        .chat-input-bar button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 184, 148, 0.45);
        }

        /* Loading Dots */
        .chat-loading {
            display: none;
            align-self: flex-start;
            margin-left: 2rem;
            animation: fadeIn 0.3s ease;
        }

        .chat-loading-bubbles {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            border-bottom-left-radius: 0;
            padding: 0.75rem 1.25rem;
            display: flex;
            gap: 0.35rem;
            align-items: center;
        }

        .chat-loading-bubbles span {
            width: 7px;
            height: 7px;
            background: var(--neon-green);
            border-radius: 50%;
            animation: dotGrow 1.2s infinite ease-in-out;
        }

        .chat-loading-bubbles span:nth-child(2) { animation-delay: 0.3s; }
        .chat-loading-bubbles span:nth-child(3) { animation-delay: 0.6s; }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.6; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.6; }
        }

        @keyframes dotGrow {
            0%, 40%, 100% { transform: scale(0.3); opacity: 0.3; }
            20% { transform: scale(1.1); opacity: 1; }
        }

        @keyframes messageFade {
            from { transform: translateY(15px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Responsive menu styling */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: row;
                justify-content: space-between;
            }

            .nav-links {
                position: fixed;
                top: 76px;
                left: -100%;
                width: 100%;
                height: calc(100vh - 76px);
                background: rgba(8, 28, 21, 0.95);
                backdrop-filter: blur(15px);
                flex-direction: column;
                justify-content: center;
                gap: 2.5rem;
                transition: 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
                border-top: 1px solid var(--glass-border);
                z-index: 100;
            }

            .nav-links.active {
                left: 0;
            }

            .menu-toggle {
                display: block;
            }

            .chat-container {
                padding: 1rem 0;
                width: 92%;
            }

            .chat-box {
                margin-bottom: 6rem;
            }

            .chat-messages {
                padding: 1.25rem;
            }

            .message {
                max-width: 85%;
            }

            .chat-input-bar, .example-prompts {
                width: 92%;
            }

            .welcome-overlay {
                padding: 1rem;
                width: 90%;
            }

            .welcome-overlay h3 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="container">
            <div class="navbar">
                <a href="/" class="logo">
                    <i class="fas fa-seedling"></i>
                    CropGuard AI
                </a>
                <div class="menu-toggle" id="mobile-menu">
                    <i class="fas fa-bars"></i>
                </div>
                <ul class="nav-links" id="nav-links">
                    <li><a href="/">Home</a></li>
                    <li><a href="/bot" class="active">Assistant (Raju)</a></li>
                    <li><a href="/about">About & Credits</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="chat-container">
        <div class="chat-box">
            <div class="chat-header">
                <div class="status-indicator"></div>
                <div>
                    <h2>Raju</h2>
                    <span>Virtual Agronomist & Gardening Specialist</span>
                </div>
            </div>

            <div class="chat-messages" id="chat-messages">
                <div class="welcome-overlay" id="welcome-message">
                    <i class="fas fa-seedling"></i>
                    <h3>Ask Raju AI</h3>
                    <p>Hello! I am Raju, your expert gardening assistant. Ask me anything about plant care, pest prevention, soil health, or treatment strategies.</p>
                </div>
            </div>

            <!-- Loader bubble -->
            <div class="chat-loading" id="chat-loading">
                <div class="chat-loading-bubbles">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>

        <!-- Sample prompts -->
        <div class="example-prompts" id="example-prompts">
            <button onclick="sendExamplePrompt('How to grow organic tomatoes at home in small pots?')">🍅 Growing Tomatoes</button>
            <button onclick="sendExamplePrompt('What are the best organic fertilizers for green leafy vegetables?')">🌿 Organic Fertilizers</button>
            <button onclick="sendExamplePrompt('How can I naturally prevent late blight disease in potatoes?')">🛡️ Prevent Late Blight</button>
        </div>

        <!-- Text input panel -->
        <div class="chat-input-bar">
            <input type="text" id="user-input" placeholder="Ask Raju a gardening question..." aria-label="Chat query input">
            <button onclick="sendMessage()"><i class="fas fa-paper-plane"></i> Send</button>
        </div>
    </div>

    <script>
        const menuToggle = document.getElementById('mobile-menu');
        const navLinks = document.getElementById('nav-links');

        menuToggle.addEventListener('click', () => {
            navLinks.classList.toggle('active');
            const icon = menuToggle.querySelector('i');
            if (navLinks.classList.contains('active')) {
                icon.className = 'fas fa-times';
            } else {
                icon.className = 'fas fa-bars';
            }
        });

        async function sendMessage() {
            const userInput = document.getElementById('user-input');
            const chatMessages = document.getElementById('chat-messages');
            const chatLoading = document.getElementById('chat-loading');
            const welcomeMessage = document.getElementById('welcome-message');
            const examplePrompts = document.getElementById('example-prompts');

            const messageText = userInput.value.trim();
            if (messageText === "") return;

            if (welcomeMessage) {
                welcomeMessage.style.display = 'none';
            }
            if (examplePrompts) {
                examplePrompts.style.display = 'none';
            }

            // Append User message
            const userMessageDiv = document.createElement('div');
            userMessageDiv.classList.add('message', 'user');
            userMessageDiv.innerHTML = `<div class="message-text">${messageText}</div>`;
            chatMessages.appendChild(userMessageDiv);

            userInput.value = '';
            chatLoading.style.display = 'block';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: messageText }),
                });
                
                const data = await response.json();
                chatLoading.style.display = 'none';

                if (data.error) {
                    throw new Error(data.error);
                }

                // Append Bot message
                const botMessageDiv = document.createElement('div');
                botMessageDiv.classList.add('message', 'bot');
                botMessageDiv.innerHTML = `<div class="message-text">${data.response}</div>`;
                chatMessages.appendChild(botMessageDiv);

                chatMessages.scrollTop = chatMessages.scrollHeight;
            } catch (error) {
                console.error('Error fetching chatbot reply:', error);
                chatLoading.style.display = 'none';

                const errorMessageDiv = document.createElement('div');
                errorMessageDiv.classList.add('message', 'bot');
                errorMessageDiv.innerHTML = `<div class="message-text">My apologies, I ran into an error communicating with my databases. Please ask again.</div>`;
                chatMessages.appendChild(errorMessageDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        }

        function sendExamplePrompt(prompt) {
            document.getElementById('user-input').value = prompt;
            sendMessage();
        }

        document.getElementById('user-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const initialPrompt = urlParams.get('prompt');
            if (initialPrompt) {
                document.getElementById('user-input').value = decodeURIComponent(initialPrompt);
                sendMessage();
            }
        };
    </script>
</body>
</html>
